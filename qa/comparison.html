<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lichico QA comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: #1b1b18; color: #f1ede2; font: 12px/1.4 ui-monospace, monospace; }
      h1 { margin: 0 0 24px; font-size: 18px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; letter-spacing: .08em; text-transform: uppercase; }
      img { display: block; width: 100%; height: 760px; object-fit: cover; object-position: top; border: 1px solid #514f47; background: #d7d0c1; }
    </style>
  </head>
  <body>
    <h1>Lichico Case Study — Reference / Implementation</h1>
    <main>
      <figure><figcaption>Existing visual language</figcaption><img src="/qa/reference.png" alt="Reference" /></figure>
      <figure><figcaption>Updated Lichico overview</figcaption><img src="/qa/implementation.png" alt="Implementation" /></figure>
    </main>
  </body>
</html>
